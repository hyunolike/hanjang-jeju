services:
  - type: web
    name: hanjang-jeju
    runtime: docker
    plan: free
    region: singapore
    branch: deploy/render-free-web
    autoDeployTrigger: off
    dockerfilePath: ./deploy/public-web/Dockerfile
    dockerContext: ./deploy/public-web
    healthCheckPath: /api/web/health
    envVars:
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_MODEL
        value: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      - key: CLOUDFLARE_FREE_PLAN_CONFIRMED
        value: "1"
