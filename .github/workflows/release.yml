name: release

# 공개 배포판을 Windows(x64), Mac(Apple 칩, Intel)용으로 미포함판과 AI 포함판, Windows AI 팩까지 만들고 실제로 켜지는지 확인한다.
# v로 시작하는 태그를 올리면 일곱 설치 파일을 GitHub Release에 붙인다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JEJU_PUBLIC: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 버전과 태그 검사
        id: version
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then args+=(--check-tag "$GITHUB_REF_NAME"); fi
          version=$(python3 scripts/release_version.py "${args[@]}")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 화면 빌드
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: 엔진 묶기 (PyInstaller)
        run: |
          uv sync --frozen
          uv run pyinstaller packaging/engine.spec --noconfirm --distpath output/dist --workpath output/build
      - name: 엔진 단독 실행 검사
        run: |
          $env:JEJU_WORKSPACE = "$env:RUNNER_TEMP\ws"
          $p = Start-Process output\dist\jeju-engine\jeju-engine.exe -ArgumentList "--port 8799" -PassThru -WindowStyle Hidden
          $sw = [Diagnostics.Stopwatch]::StartNew()
          do { Start-Sleep 1; try { $h = Invoke-RestMethod http://127.0.0.1:8799/api/health } catch { $h = $null } } until ($h -or $sw.Elapsed.TotalSeconds -gt 120)
          if (-not $h) { throw "엔진이 120초 안에 켜지지 않았어요" }
          $a = Invoke-RestMethod http://127.0.0.1:8799/api/datasets/center-1-19-dummy/analyze -TimeoutSec 300
          if (-not $a.forecast) { throw "예측 결과가 없어요" }
          "예측 방법: $($a.forecast.model)"
          $page = Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing
          if ($page.Content -notmatch "한 장 제주") { throw "화면을 내주지 못했어요" }
          Stop-Process $p.Id
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Windows 프로그램과 설치 파일
        run: |
          dotnet publish windows/HanJangJeju -c Release -o output/app
          Copy-Item output/dist/jeju-engine output/app/engine -Recurse
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer\HanJangJeju.iss
      - name: 조용히 설치하고 실행 검사
        run: |
          $setup = Get-ChildItem output\installer\*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
          $app = "$env:LOCALAPPDATA\Programs\HanJangJeju"
          if (-not (Test-Path "$app\HanJangJeju.exe")) { throw "프로그램이 설치되지 않았어요" }
          $p = Start-Process "$app\engine\jeju-engine.exe" -ArgumentList "--port 8798" -PassThru -WindowStyle Hidden
          $sw = [Diagnostics.Stopwatch]::StartNew()
          do { Start-Sleep 1; try { $h = Invoke-RestMethod http://127.0.0.1:8798/api/health } catch { $h = $null } } until ($h -or $sw.Elapsed.TotalSeconds -gt 120)
          if (-not $h) { throw "설치된 엔진이 켜지지 않았어요" }
          Stop-Process $p.Id
      - name: 단일 실행 검사 (P03)
        run: |
          $app = "$env:LOCALAPPDATA\Programs\HanJangJeju"
          $ws = "$env:LOCALAPPDATA\HanJangJeju\workspace"
          $first = Start-Process "$app\HanJangJeju.exe" -PassThru
          try {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            do {
              Start-Sleep 1
              $engine = Get-Process jeju-engine -ErrorAction SilentlyContinue | Select-Object -First 1
              $listen = if ($engine) { Get-NetTCPConnection -OwningProcess $engine.Id -State Listen -ErrorAction SilentlyContinue } else { $null }
            } until ($listen -or $sw.Elapsed.TotalSeconds -gt 120)
            if (-not $listen) { throw "첫 실행이 엔진을 켜지 않았어요" }
            New-Item -ItemType Directory -Force $ws | Out-Null
            Set-Content "$ws\keep.csv" "a`n1"
            $second = Start-Process "$app\HanJangJeju.exe" -PassThru
            $null = $second.Handle  # 종료 코드를 읽을 수 있게 핸들을 잡아 둔다
            if (-not $second.WaitForExit(15000)) { throw "두 번째 실행이 끝나지 않았어요" }
            if ($second.ExitCode -ne 0) { throw "두 번째 실행의 종료 코드가 $($second.ExitCode)예요" }
            Start-Sleep 3
            $engines = @(Get-Process jeju-engine -ErrorAction SilentlyContinue).Count
            $windows = @(Get-Process HanJangJeju -ErrorAction SilentlyContinue).Count
            if ($engines -ne 1 -or $windows -ne 1) { throw "엔진 $engines개, 프로그램 $windows개가 떠 있어요(각 1개여야 해요)" }
            if (-not (Test-Path "$ws\keep.csv")) { throw "두 번째 실행이 작업 폴더를 지웠어요" }
            "단일 실행 확인: 두 번째 실행은 $($second.ExitCode)로 끝났고 엔진은 1개예요"
          } finally {
            Stop-Process $first.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/cache@v4
        with:
          path: output/ai-pack-cache
          key: ai-pack-${{ hashFiles('packaging/ai-pack/sources.json') }}
      - name: AI 팩 만들고 설치해 계획 검사 (M06)
        env:
          # 러너의 파이프 출력은 cp1252다. 한국어 출력이 멈추지 않게 Python을 UTF-8 모드로 쓴다.
          PYTHONUTF8: "1"
        run: |
          # VC++ 재배포 패키지가 없는 새 PC에서도 켜지도록 러너의 Visual Studio 재배포 폴더에서 x64 CRT를 넣는다(M6)
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw "VC 재배포 x64 CRT 폴더를 찾지 못했어요" }
          "CRT: $($crt.FullName)"
          # 고정한 llama.cpp와 모델만 받고 SHA256이 다르거나 팩 밖 DLL이 필요하면 멈춘다(M05)
          uv run --frozen python scripts/build_ai_pack.py windows-x64 --crt-dir $crt.FullName --out output/ai-pack --cache output/ai-pack-cache
          if ($LASTEXITCODE -ne 0) { throw "AI 팩을 만들지 못했어요" }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer\HanJangJeju-AI.iss
          if ($LASTEXITCODE -ne 0) { throw "AI 팩 설치 파일을 만들지 못했어요" }
          $pack = Get-ChildItem output\installer\HanJangJeju-AI-Pack-*.exe | Select-Object -First 1
          $proc = Start-Process $pack.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "AI 팩 설치 종료 코드 $($proc.ExitCode)" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\HanJangJeju-AI\ai-pack.json")) { throw "AI 팩이 설치되지 않았어요" }
          $app = "$env:LOCALAPPDATA\Programs\HanJangJeju"

          # 1) 바깥 Job이 없는 엔진(--open과 같은 경로): 준비, 처음 보는 질문의 지연, 강제 종료 뒤 서버 정리
          $env:JEJU_WORKSPACE = "$env:RUNNER_TEMP\ws-ai"
          $p = Start-Process "$app\engine\jeju-engine.exe" -ArgumentList "--port 8796" -PassThru -WindowStyle Hidden
          try {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            do { Start-Sleep 2; try { $m = Invoke-RestMethod http://127.0.0.1:8796/api/model } catch { $m = $null } } until (($m -and $m.ready) -or $sw.Elapsed.TotalSeconds -gt 300)
            if (-not ($m -and $m.ready)) { throw "AI 팩 모델이 300초 안에 준비되지 않았어요: $($m | ConvertTo-Json -Compress)" }
            if ($m.backend -ne "pack") { throw "AI 팩이 아니라 $($m.backend)로 연결됐어요" }
            "모델 준비: $($m.model), $([int]$sw.Elapsed.TotalSeconds)초"
            # 시작 점검(1-19 더미, '작년보다 늘었어?')과 다른 자료와 질문이라 프롬프트 캐시를 쓰지 못한다(M4)
            $body = [Text.Encoding]::UTF8.GetBytes('{"question":"애월읍 방문 인구 성별 비중은?"}')
            $plan = Invoke-RestMethod -Method Post http://127.0.0.1:8796/api/datasets/center-4-11-dummy/plan -ContentType "application/json; charset=utf-8" -Body $body -TimeoutSec 120
            if ($plan.fallback) { throw "AI 팩 계획이 직접 선택으로 넘어갔어요: $($plan.reason) $($plan.detail)" }
            "처음 보는 질문의 계획: intent=$($plan.plan.intent) group_by=$($plan.plan.group_by) $($plan.latency_ms)ms (러너 CPU)"
            if (@(Get-Process llama-server -ErrorAction SilentlyContinue).Count -ne 1) { throw "AI 팩 서버가 1개가 아니에요" }
          } finally {
            # 정리 요청 없이 강제로 끝내도 엔진의 Job Object가 서버를 함께 끝내야 한다(M02)
            Stop-Process $p.Id -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep 3
          if (Get-Process llama-server -ErrorAction SilentlyContinue) { throw "엔진이 끝났는데 AI 팩 서버가 남았어요" }

          # 2) 창 프로그램 경로: WPF를 강제 종료해도 서버가 남지 않는다(M02)
          $w = Start-Process "$app\HanJangJeju.exe" -PassThru
          try {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            do { Start-Sleep 1; $s = Get-Process llama-server -ErrorAction SilentlyContinue } until ($s -or $sw.Elapsed.TotalSeconds -gt 120)
            if (-not $s) { throw "창 프로그램이 AI 팩 서버를 켜지 않았어요" }
          } finally {
            Stop-Process $w.Id -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep 5
          if (Get-Process llama-server -ErrorAction SilentlyContinue) { throw "창 프로그램이 끝났는데 AI 팩 서버가 남았어요" }
          if (Get-Process jeju-engine -ErrorAction SilentlyContinue) { throw "창 프로그램이 끝났는데 엔진이 남았어요" }
          "AI 팩 크기: {0:N0} MB" -f ($pack.Length / 1MB)
      - name: AI 포함판 만들고 설치해 검사 (B05)
        env:
          PYTHONUTF8: "1"
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /DWithAI installer\HanJangJeju.iss
          if ($LASTEXITCODE -ne 0) { throw "AI 포함판 설치 파일을 만들지 못했어요" }
          $setup = Get-ChildItem output\installer\HanJangJeju-Setup-AI-*.exe | Select-Object -First 1
          # 따로 설치한 AI 팩을 지워 앱 안 팩만으로 동작하는지 본다(B02)
          $packDir = "$env:LOCALAPPDATA\Programs\HanJangJeju-AI"
          if (Test-Path "$packDir\unins000.exe") {
            Start-Process "$packDir\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
            $sw = [Diagnostics.Stopwatch]::StartNew()
            while ((Test-Path "$packDir\ai-pack.json") -and $sw.Elapsed.TotalSeconds -lt 60) { Start-Sleep 1 }
          }
          if (Test-Path "$packDir\ai-pack.json") { throw "따로 설치한 AI 팩이 지워지지 않았어요" }
          $proc = Start-Process $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "AI 포함판 설치 종료 코드 $($proc.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\HanJangJeju"
          if (-not (Test-Path "$app\ai-pack\ai-pack.json")) { throw "AI 포함판에 ai-pack이 없어요" }
          $env:JEJU_WORKSPACE = "$env:RUNNER_TEMP\ws-ai-included"
          $p = Start-Process "$app\engine\jeju-engine.exe" -ArgumentList "--port 8795" -PassThru -WindowStyle Hidden
          try {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            do { Start-Sleep 2; try { $m = Invoke-RestMethod http://127.0.0.1:8795/api/model } catch { $m = $null } } until (($m -and $m.ready) -or $sw.Elapsed.TotalSeconds -gt 300)
            if (-not ($m -and $m.ready -and $m.backend -eq "pack")) { throw "AI 포함판 모델이 준비되지 않았어요: $($m | ConvertTo-Json -Compress)" }
            $c = Invoke-RestMethod http://127.0.0.1:8795/api/selfcheck
            $item = $c.items | Where-Object { $_.key -eq "ai_pack" }
            if ($item.detail -notmatch "앱에 포함") { throw "앱 안 팩이 아니에요: $($item.detail)" }
            $body = [Text.Encoding]::UTF8.GetBytes('{"question":"애월읍 방문 인구 성별 비중은?"}')
            $plan = Invoke-RestMethod -Method Post http://127.0.0.1:8795/api/datasets/center-4-11-dummy/plan -ContentType "application/json; charset=utf-8" -Body $body -TimeoutSec 120
            if ($plan.fallback) { throw "AI 포함판 계획이 직접 선택으로 넘어갔어요: $($plan.reason)" }
            "AI 포함판: $($item.detail), 계획 $($plan.latency_ms)ms"
          } finally {
            Stop-Process $p.Id -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep 3
          if (Get-Process llama-server -ErrorAction SilentlyContinue) { throw "엔진이 끝났는데 AI 팩 서버가 남았어요" }
          "AI 포함판 크기: {0:N0} MB" -f ($setup.Length / 1MB)
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: output/installer/*.exe
          retention-days: 14

  mac:
    needs: version
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v4
        with:
          path: output/ai-pack-cache
          key: ai-pack-${{ runner.arch }}-${{ hashFiles('packaging/ai-pack/sources.json') }}
      - name: 앱과 dmg 만들기 (미포함판과 AI 포함판)
        env:
          PYTHONUTF8: "1"
        run: |
          uv sync --frozen
          (cd web && pnpm install --frozen-lockfile && pnpm build)
          case "$(uname -m)" in arm64) PLATFORM=macos-arm64 ;; *) PLATFORM=macos-x64 ;; esac
          uv run --frozen python scripts/build_ai_pack.py "$PLATFORM" --out output/ai-pack --cache output/ai-pack-cache
          AI_PACK=output/ai-pack mac/build-app.sh
      - name: 앱 안의 엔진 실행 검사
        run: |
          ENGINE=output/mac/HanJangJeju.app/Contents/Resources/engine/jeju-engine
          JEJU_WORKSPACE=$RUNNER_TEMP/ws $ENGINE --port 8797 &
          BASE_PID=$!
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8797/api/health && break; sleep 1; done
          curl -sf -m 300 http://127.0.0.1:8797/api/datasets/center-1-19-dummy/analyze | python3 -c "import json,sys;d=json.load(sys.stdin);assert d['forecast'];print('예측 방법',d['forecast']['model'])"
          curl -sf http://127.0.0.1:8797/ | grep -q "한 장 제주"
          kill "$BASE_PID" || true  # 미포함판 엔진은 끝내고 AI 포함판을 검사한다
      - name: AI 포함판 앱 안의 엔진과 AI 검사 (B05)
        run: |
          ENGINE=output/mac/ai/HanJangJeju.app/Contents/Resources/engine/jeju-engine
          test -f output/mac/ai/HanJangJeju.app/Contents/Resources/ai-pack/ai-pack.json
          JEJU_WORKSPACE=$RUNNER_TEMP/ws-ai $ENGINE --port 8794 &
          EP=$!
          ready=""
          for i in $(seq 1 150); do
            ready=$(curl -sf http://127.0.0.1:8794/api/model | python3 -c "import json,sys;d=json.load(sys.stdin);print('yes' if d.get('ready') and d.get('backend')=='pack' else '')" 2>/dev/null || true)
            [ "$ready" = yes ] && break; sleep 2
          done
          [ "$ready" = yes ] || { echo "AI 포함판 모델이 300초 안에 준비되지 않았어요"; curl -s http://127.0.0.1:8794/api/model; exit 1; }
          curl -sf http://127.0.0.1:8794/api/selfcheck | python3 -c "import json,sys;i=[x for x in json.load(sys.stdin)['items'] if x['key']=='ai_pack'][0];print(i['detail']);assert '앱에 포함' in i['detail']"
          curl -sf -m 120 -X POST -H 'Content-Type: application/json' --data '{"question":"애월읍 방문 인구 성별 비중은?"}' http://127.0.0.1:8794/api/datasets/center-4-11-dummy/plan | python3 -c "import json,sys;d=json.load(sys.stdin);assert not d.get('fallback'),d;print('AI 포함판 계획',d['plan']['intent'],d['latency_ms'],'ms')"
          kill -TERM $EP; wait $EP || true
          sleep 2
          if pgrep -f "ai-pack/llama/llama-server"; then echo "엔진이 끝났는데 AI 팩 서버가 남았어요"; exit 1; fi
          du -sh output/mac/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.runner }}
          path: output/mac/*.dmg
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, mac]
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 체크섬과 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # README 버튼이 releases/latest/download/<이름>으로 바로 받게, 버전 없는 고정 이름으로 바꾼다
          cd dist
          # AI 포함판을 먼저 옮긴다. 미포함판 이름(숫자로 시작하는 버전)과 겹치지 않게 패턴을 좁힌다(B05)
          mv HanJangJeju-Setup-AI-*.exe HanJangJeju-Setup-windows-x64-AI.exe
          mv HanJangJeju-Setup-[0-9]*.exe HanJangJeju-Setup-windows-x64.exe
          mv HanJangJeju-AI-Pack-*.exe HanJangJeju-AI-Pack-windows-x64.exe
          mv HanJangJeju-AI-*-arm64.dmg HanJangJeju-mac-arm64-AI.dmg
          mv HanJangJeju-AI-*-x64.dmg HanJangJeju-mac-x64-AI.dmg
          mv HanJangJeju-[0-9]*-arm64.dmg HanJangJeju-mac-arm64.dmg
          mv HanJangJeju-[0-9]*-x64.dmg HanJangJeju-mac-x64.dmg
          sha256sum * > SHA256SUMS.txt && ls -la && cd ..
          bash scripts/publish_release.sh dist
