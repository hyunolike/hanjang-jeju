<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>한 장 제주</title>
<style>
  /* 색은 web/src/index.css의 디자인 토큰과 같다. Windows 시작 화면(MainWindow.xaml)과 같은 구성이다. */
  html, body { margin: 0; height: 100%; background: #f2f4f6; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; color: #191f28; }
  main { height: 100%; display: grid; place-items: center; }
  .box { width: 400px; text-align: center; word-break: keep-all; }
  img { width: 64px; height: 64px; margin: 0 0 28px; }
  h1 { font-size: 26px; line-height: 34px; margin: 0 0 12px; letter-spacing: -0.02em; }
  /* #4e5968: 바탕 #f2f4f6 대비 6.45:1. 이전 #6b7684는 4.19:1로 WCAG AA 미달이었다. */
  p { font-size: 16px; color: #4e5968; line-height: 24px; margin: 0 0 32px; }
  .bar { width: 240px; margin: 0 auto; height: 6px; border-radius: 3px; background: #e5e8eb; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: #0e7c86; border-radius: 3px; animation: go 1.2s ease-in-out infinite; }
  @keyframes go { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; opacity: .5; } }
  button { width: 100%; height: 56px; border: 0; border-radius: 16px; background: #0e7c86; color: #fff;
           font: 600 17px -apple-system, "Apple SD Gothic Neo", sans-serif; cursor: pointer; margin-top: 8px; }
  button:hover { background: #0a626a; }
  button:focus-visible { outline: 2px solid #191f28; outline-offset: 2px; }
  small { display: block; margin-top: 16px; font-size: 13px; line-height: 20px; color: #4e5968; word-break: break-all; }
</style>

    <h1 id="title">분석 엔진을 켜고 있어요</h1>
    <p id="sub">처음 켤 때는 30초쯤 걸려요.<br />인터넷 없이 이 컴퓨터 안에서만 동작해요.</p>
    <div class="bar" id="bar"><i></i></div>
  </div>
</main>
<script>
  // 엔진이 응답하면 화면으로 넘어간다. 다른 출처라 응답 내용은 읽지 않고 연결 여부만 본다.
  const url = "__ENGINE_URL__";
  const box = document.getElementById("box");
  const initial = box.innerHTML;
  let started = Date.now();
  let slowShown = false;
  async function poll() {
    try {
      await fetch(url + "api/health", { mode: "no-cors", cache: "no-store" });
      location.replace(url);
      return;
    } catch (e) {}
    const waited = Date.now() - started;
    // 30초가 지나면 멈춘 것이 아니라는 것을 알린다. 가짜 퍼센트 진행률은 쓰지 않는다.
    if (!slowShown && waited > 30000) {
      slowShown = true;
      document.getElementById("sub").textContent = "생각보다 오래 걸리고 있어요. 처음 켤 때는 1분 넘게 걸리기도 해요.";
    }
    if (waited > 120000) {
      // 무엇이 안 됐는지와 무엇을 하면 되는지만 크게 보이고, 기록 위치는 작은 글씨로 둔다.
      document.getElementById("title").textContent = "켜는 데 너무 오래 걸리고 있어요";
      document.getElementById("sub").textContent = "앱을 닫았다가 다시 열어 주세요. 그래도 안 되면 기록 파일을 센터 담당자에게 보여 주세요.";
      document.getElementById("bar").remove();
      const retry = document.createElement("button");
      retry.textContent = "다시 시도";
      // 이 화면은 문자열로 띄운 것이라 새로고침하지 않고, 처음 상태로 되돌린 뒤 다시 확인한다.
      retry.onclick = () => { box.innerHTML = initial; started = Date.now(); slowShown = false; poll(); };
      const where = document.createElement("small");
      where.textContent = "기록 파일: ~/Library/Application Support/HanJangJeju/engine.log";
      box.append(retry, where);
      return;
    }
    setTimeout(poll, 500);
  }
  poll();
</script>
