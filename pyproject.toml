[project]
name = "jeju-agent"
version = "0.1.0"
description = "제주빅데이터센터 CSV를 정리하고 결합해 분석하는 로컬 에이전트"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "statsforecast>=2.0.2",
    "fastapi>=0.163.2",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.34",
    "httpx>=0.28.1",
]

[project.scripts]
jeju-web = "jeju_agent.server:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jeju_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
# llvmlite 0.46부터 Intel Mac 휠이 없다. Intel Mac에서만 휠이 있는 마지막 짝(numba 0.62, llvmlite 0.45)으로 묶는다.
constraint-dependencies = [
    "numba<0.63; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "llvmlite<0.46; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
