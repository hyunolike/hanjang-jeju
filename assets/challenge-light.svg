<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="180" viewBox="0 0 840 180" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">한 장 제주 — 2026 제주 AI·빅데이터 AI Agent 챌린지 출품작</title>
  <desc id="banner-description">센터 PC 안에서 CSV를 분석해 보고서용 결과 한 장을 만드는 로컬 에이전트. 오른쪽에는 한라산과 바다, 감귤과 잎, 해와 데이터 막대를 그린 독창적인 제주 풍경.</desc>
  <defs>
