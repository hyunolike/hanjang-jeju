    <text x="32" y="89" font-size="30" font-weight="800" textLength="524" lengthAdjust="spacingAndGlyphs">제주 AI·빅데이터 AI Agent 챌린지</text>
    <text x="32" y="122" font-size="17" font-weight="400" fill-opacity="0.92"><tspan x="32">센터 PC 안에서 CSV를 분석해</tspan><tspan x="32" dy="25">보고서용 결과 한 장을 만드는 로컬 에이전트</tspan></text>
