<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1040" viewBox="0 0 1120 1040" role="img" aria-labelledby="title desc">
<title id="title">Source sync and installer releases</title><desc id="desc">CircleCI syncs allowed files to public main. An unchanged version keeps existing installers. A higher stable version tags the public commit and builds Windows x64 and macOS arm64/x64. After smoke tests succeed, installers and checksums are uploaded to a draft and published. Web deployment is separate.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#526676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1120" height="1040" rx="0" fill="#F7F9FC" />
<rect x="32" y="28" width="124" height="32" rx="10" fill="#E5F4F3" />
<text x="94.0" y="51" font-size="18" font-weight="700" fill="#0E7C86" text-anchor="middle" data-max-width="112">Release</text>
<text x="32" y="108" font-size="34" font-weight="750" fill="#172C3B" text-anchor="start" data-max-width="1056">A version bump starts an installer release</text>
<text x="32" y="144" font-size="20" font-weight="500" fill="#526676" text-anchor="start" data-max-width="1056">Source updates and installer releases are separate steps.</text>
<rect x="272" y="180" width="576" height="100" rx="20" fill="#E5F4F3" />
<g transform="translate(296 205)" fill="none" stroke="#0E7C86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="3" /><circle cx="6" cy="24" r="3" /><circle cx="23" cy="5" r="3" /><path d="M6 8v13M23 8c0 9-17 3-17 12" /></g>
<text x="344" y="219" font-size="24" font-weight="700" fill="#0E7C86" text-anchor="start" data-max-width="480">Development main → public main</text>
<text x="344" y="254" font-size="20" font-weight="500" fill="#172C3B" text-anchor="start" data-max-width="480">CircleCI validates and syncs allowed files only</text>
<path d="M560 288V320" fill="none" stroke="#526676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<rect x="336" y="332" width="448" height="88" rx="20" fill="#FFF3E0" />
<text x="560" y="367" font-size="24" font-weight="700" fill="#A96912" text-anchor="middle" data-max-width="416">New stable version above all tags?</text>
<text x="560" y="399" font-size="20" font-weight="500" fill="#172C3B" text-anchor="middle" data-max-width="416">Version source: pyproject.toml / project.version</text>
