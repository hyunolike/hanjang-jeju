<text x="56" y="572" font-size="20" font-weight="500" fill="#526676" text-anchor="start" data-max-width="256">Keep published installers</text>
<text x="56" y="602" font-size="20" font-weight="500" fill="#526676" text-anchor="start" data-max-width="256">README-only updates</text>
