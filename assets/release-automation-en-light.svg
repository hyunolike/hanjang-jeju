<text x="432" y="524" font-size="24" font-weight="700" fill="#172C3B" text-anchor="start" data-max-width="632">Create vX.Y.Z tag</text>
<text x="432" y="555" font-size="20" font-weight="500" fill="#172C3B" text-anchor="start" data-max-width="632">Tag the synchronized public commit</text>
