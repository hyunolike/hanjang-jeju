<path d="M796 376H892V476" fill="none" stroke="#526676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
<rect x="132" y="428" width="104" height="32" rx="10" fill="#EDF2F6" />
<text x="184.0" y="451" font-size="18" font-weight="700" fill="#526676" text-anchor="middle" data-max-width="92">No bump</text>
<rect x="840" y="428" width="104" height="32" rx="10" fill="#FFF3E0" />
<text x="892.0" y="451" font-size="18" font-weight="700" fill="#A96912" text-anchor="middle" data-max-width="92">Bumped</text>
