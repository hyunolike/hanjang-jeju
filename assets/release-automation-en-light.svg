<text x="56" y="846" font-size="20" font-weight="500" fill="#526676" text-anchor="start" data-max-width="256">point to the latest</text>
<text x="56" y="876" font-size="20" font-weight="500" fill="#526676" text-anchor="start" data-max-width="256">published installers.</text>
<rect x="32" y="948" width="1056" height="60" rx="20" fill="#EDF2F6" />
<text x="56" y="985" font-size="20" font-weight="500" fill="#172C3B" text-anchor="start" data-max-width="1008">Rerun failed steps to recover. Manual main builds do not publish. Web deployment is separate.</text>
