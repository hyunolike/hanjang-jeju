<text x="480" y="848" font-size="24" font-weight="750" fill="#0E7C86" text-anchor="start" data-max-width="580">Publish after all checks pass</text>
<text x="432" y="891" font-size="20" font-weight="500" fill="#172C3B" text-anchor="start" data-max-width="632">3 installers + checksums → draft upload → publish</text>
