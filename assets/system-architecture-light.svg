<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="568" viewBox="0 0 880 568" role="img" aria-labelledby="title desc">
<title id="title">한 장 제주 시스템 구조</title>
<desc id="desc">모든 처리는 이용자 PC 안에서 실행됩니다. 프로그램 창은 공통 분석 엔진을 숨김 실행하고, 준비되면 화면을 엽니다. 빈 포트에 실행한 Python 3.11과 FastAPI 엔진은 PyInstaller로 묶습니다. .NET 10 기반 창이 127.0.0.1로 요청합니다. 선택적인 로컬 AI에는 질문만 보냅니다. 창을 닫으면 임시 자료를 지우고 엔진을 종료합니다.</desc>
<g font-family="&#x27;Pretendard&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, &#x27;Noto Sans KR&#x27;, sans-serif">
