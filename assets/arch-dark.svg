<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" role="img" aria-labelledby="title desc">
<title id="title">한 장 제주 시스템 구성 — 다크</title>
<desc id="desc">인터넷 없이 이용자 PC에서 동작하는 한 장 제주. Windows WPF와 Mac Photino 앱은 빈 포트에 숨김 자식 프로세스로 공통 Python 분석 엔진을 실행하고 127.0.0.1의 화면을 표시한다. 창을 닫으면 작업 폴더 지우기를 요청하고 엔진을 종료한다. 엔진은 내장 자료와 이용자의 CSV 작업 폴더를 사용한다. 선택 기능인 Ollama Qwen3 1.7B에는 질문을 분석 계획으로 바꾸는 요청만 보내며 원본 자료는 보내지 않는다. 외부 서버와 외부 AI로 전송하지 않는다.</desc>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#ABB8C6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="optional-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#F59F00" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #E6EDF3; font-size: 12px; }
.heading { font-size: 15px; font-weight: 700; }
.small { font-size: 11px; }
.muted { fill: #ABB8C6; }
.teal { fill: #3FB8C2; }
.amber { fill: #F59F00; }
.box { fill: #161B22; stroke: #30363D; stroke-width: 1; }
.line { fill: none; stroke: #ABB8C6; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</defs>
<rect width="880" height="620" fill="#0D1117"/>
<text x="24" y="26" font-size="19" style="font-size:19px;font-weight:750">한 장 제주</text>
<text x="130" y="25" class="muted">시스템 구성</text>
<rect x="16" y="42" width="848" height="536" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="1.3"/>
<text x="32" y="64" style="font-size:13px;font-weight:700">이용자 PC (인터넷 없이 동작)</text>

<rect x="32" y="78" width="398" height="133" rx="12" class="box"/>
<text x="48" y="100" class="heading">HanJangJeju.exe</text>
<text x="414" y="100" text-anchor="end" class="muted small">Windows</text>
<text x="48" y="120">.NET 9 WPF + WebView2</text>
<text x="48" y="141" class="small">Inno Setup · 사용자별 설치 (관리자 권한 불필요)</text>
<text x="48" y="158" class="small muted">%LOCALAPPDATA%\Programs\HanJangJeju</text>
<text x="48" y="178" class="small">시작 메뉴: 웹 브라우저로 열기(Chrome, Edge)</text>
<text x="48" y="197" class="small muted">숨김 자식 프로세스 · Job Object로 창과 함께 종료</text>

<rect x="450" y="78" width="398" height="133" rx="12" class="box"/>
<text x="466" y="100" class="heading">HanJangJeju.app</text>
<text x="832" y="100" text-anchor="end" class="muted small">Mac</text>
<text x="466" y="120">.NET 9 Photino + WKWebView</text>
<text x="466" y="141">dmg 배포 (Apple 칩 arm64, Intel x64)</text>
<text x="466" y="165" class="small muted">숨김 자식 프로세스 · --parent-pid</text>
<text x="466" y="190" class="small muted">화면 주소: http://127.0.0.1:&lt;port&gt;</text>

<path d="M649 211 V224 H231 M231 211 V224 H48 V292" class="line" marker-end="url(#arrow)"/>
<text x="64" y="243">① 빈 포트로 엔진 실행</text>
<text x="64" y="261">② 화면 불러오기 (127.0.0.1)</text>
<text x="64" y="279">③ 창 닫을 때 작업 폴더 지우기 요청 → 엔진 종료</text>

<rect x="32" y="292" width="560" height="151" rx="14" fill="#161B22" stroke="#3FB8C2" stroke-width="1.5"/>
<text x="48" y="316" class="heading teal">분석 엔진 jeju-engine</text>
<text x="48" y="335" class="muted">Python 3.11을 PyInstaller로 묶음 · 127.0.0.1에서만 수신</text>

<rect x="48" y="347" width="130" height="24" rx="7" fill="#0D1117" stroke="#30363D"/><text x="113" y="363" text-anchor="middle" style="font-size:11px">FastAPI · uvicorn</text>
<rect x="186" y="347" width="70" height="24" rx="7" fill="#0D1117" stroke="#30363D"/><text x="221" y="363" text-anchor="middle" style="font-size:11px">pandas</text>
<rect x="264" y="347" width="150" height="24" rx="7" fill="#0D1117" stroke="#30363D"/><text x="339" y="363" text-anchor="middle" style="font-size:11px">statsforecast(예측)</text>
<rect x="48" y="381" width="44" height="24" rx="7" fill="#0D1117" stroke="#30363D"/><text x="70" y="397" text-anchor="middle" style="font-size:12px">이해</text>
<rect x="98" y="381" width="44" height="24" rx="7" fill="#0D1117" stroke="#30363D"/><text x="120" y="397" text-anchor="middle" style="font-size:12px">분석</text>
<rect x="148" y="381" width="44" height="24" rx="7" fill="#0D1117" stroke="#30363D"/><text x="170" y="397" text-anchor="middle" style="font-size:12px">예측</text>
<rect x="198" y="381" width="238" height="24" rx="7" fill="#0D1117" stroke="#30363D"/><text x="317" y="397" text-anchor="middle" style="font-size:12px">계획기(질문→계획→코드 검증)</text>
<rect x="442" y="381" width="134" height="24" rx="7" fill="#0D1117" stroke="#30363D"/><text x="509" y="397" text-anchor="middle" style="font-size:12px">점검과 지우기</text>

<text x="48" y="427" class="muted">화면: React 19 + Vite 빌드</text>

<path d="M592 329 H612 V284 H741 V307" fill="none" stroke="#F59F00" stroke-width="1.2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#optional-arrow)"/>
<text x="634" y="250" class="amber">질문 → 분석 계획만</text>
<text x="634" y="269" class="amber small">(원본 자료 안 보냄)</text>
<rect x="634" y="307" width="214" height="124" rx="14" fill="#161B22" stroke="#F59F00" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="650" y="333" class="heading amber">로컬 AI (선택)</text>
<text x="650" y="360">Ollama · Qwen3 1.7B</text>
<text x="650" y="383" class="muted">127.0.0.1:11434</text>
<text x="650" y="412" class="small muted">질문을 분석 계획으로 변환</text>

<path d="M171 466 V443" class="line" marker-end="url(#arrow)"/>
<path d="M587 443 V466" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="32" y="466" width="278" height="100" rx="12" class="box"/>
<text x="48" y="489" class="heading">내장 자료</text>
<text x="48" y="515">센터 자료 예시(더미 CSV)</text>
<text x="48" y="539" style="font-size:11.5px">공개 명세서 사전(center_spec.json)</text>

<rect x="326" y="466" width="522" height="100" rx="12" class="box"/>
<text x="342" y="489" class="heading">작업 폴더 (이용자가 넣은 CSV)</text>
<text x="342" y="510" class="small muted">Windows  %LOCALAPPDATA%\HanJangJeju\workspace</text>
<text x="342" y="529" class="small muted">Mac  ~/Library/Application Support/HanJangJeju/workspace</text>
<text x="342" y="550" class="small">끝낼 때 자동 지우기(ON/OFF)</text>

<g aria-label="외부 전송 없음">
<path d="M29 605 C21 605 21 594 29 593 C29 583 44 581 48 590 C58 587 64 594 61 600 C60 604 57 605 53 605 Z" class="line"/>
<path d="M24 608 L62 583 M67 596 H88" class="line"/>
<path d="M77 590 L87 602 M87 590 L77 602" class="line"/>
<text x="100" y="601" style="font-size:12px;font-weight:600">외부 서버, 외부 AI 전송 없음</text>
</g>
<path d="M579 597 H607" class="line"/>
<text x="615" y="601" class="small muted">실선 = 항상 동작</text>
<path d="M734 597 H762" fill="none" stroke="#F59F00" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="770" y="601" class="small muted">점선 = 선택</text>
</svg>